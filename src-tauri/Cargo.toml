[package]
name = "focus-timer"
version = "0.1.0"
description = "A quiet, local-first focus timer by Sugar"
authors = ["Sugar"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/makersns/focus-timer"
homepage = "https://sugar.makersns.com"

[lib]
name = "focus_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-notification = "=2.8.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", features = ["clock"] }
uuid = { version = "=1.29.3", features = ["v4"] }
sys-locale = "=0.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
open = "=5.4.5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
